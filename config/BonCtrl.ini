;ネットワークによって使用デコード処理DLLを指定
;B25Decoder.dllの使用しているインターフェースのDLLを用意すれば利用可能
[SET]
FFFFFFFF=B25Decoder.so
0004FFFF=B25Decoder.so
0006FFFF=B25Decoder.so
0007FFFF=B25Decoder.so
000AFFFF=B1Decoder.so
0001FFFF=B1Decoder.so
0003FFFF=B1Decoder.so

